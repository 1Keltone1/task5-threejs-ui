<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR — Задание 5: Three.js + UI + HDRI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        #ui-panel button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #fff;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        #ui-panel button:active { background: rgba(255,255,255,0.3); }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
