<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR — Задание 5: Three.js + UI + HDRI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Контейнер для UI */
        #ui-panel {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            pointer-events: none; /* Пропускаем тапы сквозь пустые места */
        }

        /* Кнопки */
        .btn-row {
            display: flex;
            gap: 10px;
            pointer-events: auto; /* Кнопки кликабельны */
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #fff;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        button:active { background: rgba(255,255,255,0.3); }

        /* Палитра цветов */
        .color-palette {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 20px;
            pointer-events: auto;
        }
        .color-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Панель управления -->
    <div id="ui-panel">
        <!-- Палитра цветов -->
        <div class="color-palette">
            <div class="color-circle" style="background: #ff5733;" data-color="0xff5733"></div>
            <div class="color-circle" style="background: #33ff57;" data-color="0x33ff57"></div>
            <div class="color-circle" style="background: #3357ff;" data-color="0x3357ff"></div>
            <div class="color-circle" style="background: #ff33f1;" data-color="0xff33f1"></div>
            <div class="color-circle" style="background: #ffd733;" data-color="0xffd733"></div>
        </div>
        
        <!-- Кнопки действий -->
        <div class="btn-row">
            <button id="btn-rotate">Повернуть</button>
            <button id="btn-model">Сменить модель</button>
            <button id="btn-clear">Очистить</button>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
