<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR — Задание 5</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Кнопка запуска AR (до входа) */
        #start-ar-btn {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px; font-size: 18px;
            background: #007bff; color: white;
            border: none; border-radius: 30px; cursor: pointer;
            z-index: 10000;
        }

        /* Главный контейнер, который занимает ВЕСЬ экран */
        #ar-overlay {
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            display: none; /* Появится при входе в AR */
            flex-direction: column; /* Элементы друг под другом */
            justify-content: flex-end; /* Прижимаем всё к НИЗУ */
            align-items: center; 
            gap: 12px;
            z-index: 10000; 
            pointer-events: none; /* Пропускаем клики в 3D */
            box-sizing: border-box;
            padding-bottom: 20px; /* Отступ от нижнего края */
        }

        /* Тот самый "пустышка", который выталкивает кнопки вниз */
        .spacer {
            flex-grow: 1; /* Занимает всё свободное пространство сверху */
            pointer-events: none;
        }

        /* Ряд с кнопками */
        .btn-row { 
            display: flex; 
            gap: 8px; 
            pointer-events: auto; /* Кнопки кликабельны */
            flex-wrap: wrap; 
            justify-content: center;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        button.action-btn {
            padding: 10px 12px; 
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.75); 
            color: #fff;
            font-size: 13px; 
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            white-space: nowrap; 
        }
        button.action-btn:active { background: rgba(255, 255, 255, 0.3); }

        #btn-add {
            background: rgba(0, 123, 255, 0.85);
            border-color: #007bff;
        }

        /* Палитра цветов */
        .color-palette {
            display: flex; 
            gap: 10px; 
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px; 
            border-radius: 30px;
            pointer-events: auto; 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        .color-circle {
            width: 28px; 
            height: 28px; 
            border-radius: 50%;
            border: 2px solid #fff; 
            cursor: pointer;
        }
        .color-circle:active { transform: scale(0.9); }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>
</head>
<body>
    <button id="start-ar-btn">Запустить AR</button>

    <!-- Оверлей на весь экран -->
    <div id="ar-overlay">
        <!-- Пустой блок, который выталкивает кнопки вниз -->
        <div class="spacer"></div>

        <!-- Палитра цветов -->
        <div class="color-palette">
            <div class="color-circle" style="background: #ff5733;" data-color="0xff5733"></div>
            <div class="color-circle" style="background: #33ff57;" data-color="0x33ff57"></div>
            <div class="color-circle" style="background: #3357ff;" data-color="0x3357ff"></div>
            <div class="color-circle" style="background: #ff33f1;" data-color="0xff33f1"></div>
            <div class="color-circle" style="background: #ffffff;" data-color="0xffffff"></div>
        </div>
        
        <!-- Кнопки действий -->
        <div class="btn-row">
            <button class="action-btn" id="btn-add">Добавить</button>
            <button class="action-btn" id="btn-rotate">Повернуть</button>
            <button class="action-btn" id="btn-model">Сменить</button>
            <button class="action-btn" id="btn-clear">Очистить</button>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
