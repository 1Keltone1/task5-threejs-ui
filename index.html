<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR — Задание 5: Three.js + UI + HDRI</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: sans-serif; 
        }

        /* Контейнер для AR-оверлея (кнопок внутри AR) */
        #ar-overlay {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            pointer-events: none; /* Пропускаем тапы сквозь пустые места */
        }

        /* Контейнер для кнопок */
        .btn-row {
            display: flex;
            gap: 10px;
            pointer-events: auto; /* Включаем клики по кнопкам */
        }

        /* Стили кнопок */
        button {
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        button:active { 
            background: rgba(255, 255, 255, 0.3); 
        }

        /* Палитра цветов */
        .color-palette {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 30px;
            pointer-events: auto; /* Включаем клики по палитре */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* Кружки цветов */
        .color-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .color-circle:active {
            transform: scale(0.9);
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Контейнер для кнопок, который будет передан в domOverlay -->
    <div id="ar-overlay">
        <!-- Палитра цветов -->
        <div class="color-palette">
            <div class="color-circle" style="background: #ff5733;" data-color="0xff5733"></div>
            <div class="color-circle" style="background: #33ff57;" data-color="0x33ff57"></div>
            <div class="color-circle" style="background: #3357ff;" data-color="0x3357ff"></div>
            <div class="color-circle" style="background: #ff33f1;" data-color="0xff33f1"></div>
            <div class="color-circle" style="background: #ffd733;" data-color="0xffd733"></div>
            <div class="color-circle" style="background: #ffffff;" data-color="0xffffff"></div>
        </div>
        
        <!-- Кнопки управления -->
        <div class="btn-row">
            <button id="btn-rotate">Повернуть</button>
            <button id="btn-model">Сменить модель</button>
            <button id="btn-clear">Очистить</button>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
